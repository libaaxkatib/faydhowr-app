<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Fayadhowr Web Panel</title>
    <script>
      /* Sets <html lang> before the page is painted: Somali when it is the saved choice, English otherwise (also when nothing is saved or the value is
         unreadable). Same rule as src/i18n/language.ts (a unit test runs this exact script and compares the two). */
      (function () {
        var lang = 'en';
        try {
          if (window.localStorage.getItem('fayadhowr.ui.language') === 'so') lang = 'so';
        } catch (e) {}
        document.documentElement.setAttribute('lang', lang);
      })();
    </script>
    <script>
      /* Applies the saved colour theme before the page is painted, so a reload never flashes the wrong theme.
         Same rules as src/theme/theme.ts (a unit test runs this exact script and compares the two). */
      (function () {
        var mode = 'light';
        try {
          var stored = window.localStorage.getItem('fayadhowr.ui.theme');
          if (stored === 'light' || stored === 'dark' || stored === 'system') mode = stored;
        } catch (e) {}
        var dark = mode === 'dark';
        if (mode === 'system') {
          try {
            dark = window.matchMedia('(prefers-color-scheme: dark)').matches === true;
          } catch (e) {
            dark = false;
          }
        }
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
    <style>
      /* Until the stylesheet is applied (development builds inject it from JavaScript), the dark theme must not start on a white page. */
      html[data-theme='dark'] { background-color: #0b1220; color-scheme: dark; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
